name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Install pana
        run: dart pub global activate pana
      - name: pub.dev score (pana)
        run: |
          dart pub global run pana --no-warning | tee pana-report.txt
          grep "Points:" pana-report.txt
      - name: Example dependencies
        run: flutter pub get
        working-directory: example
      - name: Example analyze
        run: flutter analyze
        working-directory: example
