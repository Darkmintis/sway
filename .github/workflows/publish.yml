name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for pub.dev
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same Flutter path as the green CI job.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Resolve deps BEFORE OIDC token is registered. setup-dart injects a
      # PUB_TOKEN that has been known to 401 public archive downloads
      # (dart-lang/pub-dev#7623-style failures), which breaks `pub get`.
      - name: Install dependencies
        run: flutter pub get

      # Flutter may rewrite analysis_options.yaml on pub get. That dirties
      # the tree and makes `publish --dry-run` exit 65 on a warning even
      # though real `publish --force` would succeed. Restore committed files
      # so the uploaded archive matches git.
      - name: Restore analysis_options
        run: |
          git diff -- analysis_options.yaml example/analysis_options.yaml || true
          git checkout -- analysis_options.yaml example/analysis_options.yaml

      - name: Setup Dart OIDC
        uses: dart-lang/setup-dart@v1

      # --force: skip confirm; warnings (e.g. transient dirty-tree) still upload.
      # Errors still fail the job.
      - name: Publish
        run: flutter pub publish --force
