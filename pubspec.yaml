name: sway
description: >-
  Type-safe Flutter localization with an instant in-app locale switcher and
  zero-friction migration from ARB, easy_localization, and slang.
version: 0.2.0
homepage: https://github.com/Darkmintis/sway
repository: https://github.com/Darkmintis/sway
issue_tracker: https://github.com/Darkmintis/sway/issues
documentation: https://github.com/Darkmintis/sway#readme

topics:
  - localization
  - i18n
  - l10n
  - translation
  - flutter

screenshots:
  - description: Example app — switch locales and preview RTL/LTR with the overlay
    path: branding/demo.gif

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

executables:
  codegen: codegen
  migrate: migrate

flutter:

platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:
